<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  
  <!-- Stall roof -->
  <path d="M40 110 L100 50 L160 110 V160 H40 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  
  <!-- Stall counter -->
  <path d="M50 125 H150 V150 H50 Z" fill="#1E293B"/>
  
  <!-- Code brackets -->
  <path d="M70 75 L85 55 L100 75" stroke="url(#vs-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- App icon (square) -->
  <rect x="120" y="65" width="30" height="30" rx="6" fill="#2563EB"/>
  <rect x="126" y="71" width="18" height="6" rx="3" fill="#F8FAFC"/>
  
  <!-- Vibe dot -->
  <circle cx="130" cy="105" r="6" fill="#16A34A"/>
  
  <!-- Vertical stall lines -->
  <path d="M55 110 V160" stroke="#334155" stroke-width="2"/>
  <path d="M145 110 V160" stroke="#334155" stroke-width="2"/>
</svg>
