<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vibestall-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="vibestall-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  
  <!-- Marketplace stall icon -->
  <path d="M50 120 L70 70 L90 120" stroke="url(#vibestall-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 140 H100 V160 H40 Z" fill="#2563EB"/>
  <rect x="45" y="125" width="10" height="15" fill="#F8FAFC" rx="2"/>
  <rect x="65" y="125" width="10" height="15" fill="#F8FAFC" rx="2"/>
  <rect x="85" y="125" width="10" height="15" fill="#F8FAFC" rx="2"/>
  
  <!-- Code brackets -->
  <path d="M130 70 L150 100 L130 130" stroke="#16A34A" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- Vibe waves -->
  <path d="M140 80 Q150 80 150 90 Q150 100 140 100 Q130 100 130 90 Q130 80 140 80" stroke="#3B82F6" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M145 85 Q155 85 155 95 Q155 105 145 105 Q135 105 135 95 Q135 85 145 85" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Shield/check mark for security -->
  <path d="M110 40 L125 55 L145 45" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
